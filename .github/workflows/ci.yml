name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install dependencies
        run: |
          git submodule update --init --recursive
          if [ ! -d lib/forge-std ]; then
            forge install foundry-rs/forge-std@v1.7.6 
          fi
          if [ ! -d lib/openzeppelin-contracts ]; then
            forge install OpenZeppelin/openzeppelin-contracts@v5.5.0 
          fi
      - name: Run tests
        run: |
          set -euo pipefail
          # Only run subdirectories under test/ (exclude root-level test/*.t.sol).
          mapfile -t test_dirs < <(find test -mindepth 2 -type f -name '*t.sol' -printf '%h\n' | sort -u)

          echo "Discovered test directories (${#test_dirs[@]}):"
          printf ' - %s\n' "${test_dirs[@]}"

          for dir in "${test_dirs[@]}"; do
            forge test --match-path "${dir}/*t.sol"
          done
